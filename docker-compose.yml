services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-${DB_NAME:-ecommerce_ops}}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-ecommerce}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:?Define POSTGRES_PASSWORD or DB_PASSWORD in .env}}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-${DB_PORT:-5433}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-${DB_USER:-ecommerce}} -d ${POSTGRES_DB:-${DB_NAME:-ecommerce_ops}}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
